# Local stack: backend (with bundled demo RTSP streams) and the frontend
# dev server. Open http://localhost:5173 once both are up.
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      ALLOWED_ORIGINS: "localhost:*,127.0.0.1:*"
      # Lets you add cameras on your own LAN, e.g. rtsp://192.168.1.20/stream.
      ALLOW_PRIVATE_NETWORKS: "true"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
